services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: shram_saathi
      POSTGRES_USER: shram
      POSTGRES_PASSWORD: shram_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shram -d shram_saathi"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
