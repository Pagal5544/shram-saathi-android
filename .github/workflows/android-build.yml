name: Android Debug Build

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Configure Firebase app (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
      - name: Build debug APK
        env:
          SHRAM_API_BASE_URL: ${{ secrets.SHRAM_API_BASE_URL }}
        run: gradle assembleDebug -PSHRAM_API_BASE_URL="$SHRAM_API_BASE_URL"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shram-saathi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
